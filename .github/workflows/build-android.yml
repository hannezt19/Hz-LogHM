name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Siapkan folder www
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp -r icons www/ || true

      - name: Tambah platform Android (jika belum ada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup signing key (jika ada secret)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          cat > android/app/keystore.properties << EOF
          storeFile=release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Pasang signing config ke build.gradle
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat >> android/app/build.gradle << 'GRADLEEOF'

          android {
              signingConfigs {
                  release {
                      def keystorePropertiesFile = file("keystore.properties")
                      if (keystorePropertiesFile.exists()) {
                          def keystoreProperties = new Properties()
                          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLEEOF

      - name: Build APK Debug (tanpa signing khusus)
        if: env.HAS_KEYSTORE == 'false'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build APK Release (signed, jika secret tersedia)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Debug sebagai artifact
        if: env.HAS_KEYSTORE == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: LogHM-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Release sebagai artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LogHM-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
